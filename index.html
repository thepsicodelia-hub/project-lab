  <meta property="og:site_name" content="Project Lab">

  <meta property="og:description" content="Mais espaço para criar. Mais clareza para produzir.">
  <meta property="og:url" content="https://www.projectlabstudio.com.br/">
  <meta property="og:image" content="https://www.projectlabstudio.com.br/brand/project-lab-social-v3.jpg">
  <meta property="og:image:secure_url" content="https://www.projectlabstudio.com.br/brand/project-lab-social-v3.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Project Lab — Seu estúdio em movimento.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Project Lab — Seu estúdio, em movimento">
  <meta name="twitter:description" content="Mais espaço para criar. Mais clareza para produzir.">
  <meta name="twitter:image" content="https://www.projectlabstudio.com.br/brand/project-lab-social-v3.jpg">
  <title>Project Lab — Seu estúdio, em movimento</title>
  <link rel="icon" type="image/svg+xml" href="/brand/project-lab-symbol.svg?v=2">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./src/auth.css">
  <link rel="stylesheet" href="./pulse.css">
  <link rel="stylesheet" href="./clean.css">
  <script type="module" src="./app.js"></script>
</head>
<body class="auth-locked">
  <section id="auth-screen" aria-label="Acesso ao Project Lab"><p class="auth-loading">Carregando Project Lab…</p></section>
  <noscript>Ative o JavaScript para usar o Project Lab.</noscript>
  <a class="skip" href="#content">Ir para o conteúdo</a>
  <div id="scroll-progress" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar">
      <a href="#dashboard" id="home-brand" class="brand" aria-label="Project Lab, início">projectlab</a>
      <div class="workspace"><span class="workspace-icon" data-icon="aperture"></span><div><strong>Meu estúdio</strong><small>Espaço de produção</small></div></div>
      <div class="top-actions">
        <button id="pulse-effects" class="effects-toggle" aria-pressed="true" title="Pausar os efeitos de movimento"><span class="effects-dot"></span><span>Efeitos ligados</span></button>
        <button class="search-trigger" data-action="search" aria-label="Buscar no estúdio"><span data-icon="search"></span><span>Buscar</span><kbd>⌘ K</kbd></button>
        <button class="icon-button" data-action="notifications" aria-label="Ver próximos compromissos" aria-controls="notification-panel" aria-expanded="false"><span data-icon="bell"></span><i class="notification-dot"></i></button>
        <button class="profile-avatar" data-action="account" aria-label="Conta, trocar estúdio ou sair"><span data-icon="settings"></span></button>
        <button class="icon-button mobile-menu" id="menu-toggle" aria-label="Abrir navegação" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span></button>
      </div>
    </header>
    <aside id="notification-panel" class="notification-panel" aria-label="Próximos compromissos" hidden></aside>
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
      <nav id="navigation" aria-label="Áreas do estúdio"></nav>
      <div class="sidebar-bottom"><a href="#settings" class="nav-link" id="settings-link"><span data-icon="settings"></span><span class="nav-text">Configurações</span></a><div class="demo-note" hidden><strong>Prévia interativa</strong><small>Dados de demonstração</small></div></div>
    </aside>
    <button class="sidebar-shade" id="shade" aria-label="Fechar navegação"></button>
    <div class="pulse-context"><div><span class="context-dot"></span><strong id="crumb">Painel</strong><span class="context-slash">/</span><span>Seu espaço de produção</span></div></div>
    <div id="sync-notice" class="sync-notice" role="status" hidden></div>
    <main id="content" tabindex="-1"></main>
    <footer class="app-footer"><span>PROJECT LAB <span class="footer-separator">/</span> IDEIAS EM MOVIMENTO.</span><span id="save-status">Conectando…</span></footer>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><div><span class="eyebrow" id="modal-eyebrow">PROJECT LAB</span><h2 id="modal-title"></h2></div><button class="icon-button" id="close-modal" aria-label="Fechar janela"><span data-icon="x"></span></button></div><div id="modal-content"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
