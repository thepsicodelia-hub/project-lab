<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10120f" />
    <title>Project Lab — Seu estúdio, em movimento</title>
    <link rel="icon" href="/brand/project-lab-symbol.svg" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="/src/auth.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body class="auth-locked">
    <section id="auth-screen" aria-label="Acesso ao Project Lab">
      <p class="auth-loading">Carregando Project Lab…</p>
    </section>
    <noscript>Ative o JavaScript para usar o Project Lab.</noscript>
    <a class="skip" href="#content">Ir para o conteúdo</a>
    <aside class="sidebar" id="sidebar" aria-label="Menu principal">
      <a href="#dashboard" class="brand"
        ><span class="brand-mark">p<span>l</span></span
        ><span
          >project<span class="brand-light">lab</span
          ><small>PRODUCTION WORKSPACE</small></span
        ></a
      >
      <div class="workspace">
        <span class="workspace-icon" data-icon="aperture"></span>
        <div><strong>Meu estúdio</strong><small>Espaço de produção</small></div>
        <span class="tiny-dot"></span>
      </div>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom">
        <a href="#settings" class="nav-link" id="settings-link"
          ><span data-icon="settings"></span>Configurações</a
        >
        <div class="demo-note">
          <span class="demo-dot"></span>
          <div>
            <strong>Prévia interativa</strong
            ><small>Dados de demonstração</small>
          </div>
          <span class="version">V2</span>
        </div>
      </div>
    </aside>
    <button class="sidebar-shade" id="shade" aria-label="Fechar menu"></button>
    <div class="app-shell">
      <header class="topbar">
        <div class="breadcrumb">
          <button
            class="icon-button mobile-menu"
            id="menu-toggle"
            aria-label="Abrir menu"
          >
            <span data-icon="menu"></span></button
          ><span class="muted">Workspace</span
          ><span class="crumb-divider">/</span
          ><strong id="crumb">Visão geral</strong>
        </div>
        <div class="top-actions">
          <button
            class="search-trigger"
            data-action="search"
            aria-label="Buscar no estúdio"
          >
            <span data-icon="search"></span><span>Buscar no estúdio</span
            ><kbd>Ctrl K</kbd></button
          ><span class="top-divider"></span
          ><button
            class="icon-button"
            data-action="notifications"
            aria-label="Ver próximos compromissos"
          >
            <span data-icon="bell"></span
            ><i class="notification-dot"></i></button
          ><button
            class="profile-avatar"
            data-action="account"
            aria-label="Minha conta"
          >
            PL
          </button>
        </div>
      </header>
      <div id="sync-notice" class="sync-notice" role="status" hidden></div>
      <main id="content" tabindex="-1"></main>
      <footer class="app-footer">
        <span
          >PROJECT LAB <span class="footer-separator">/</span> CRIADO PARA QUEM
          CRIA.</span
        ><span id="save-status">Prévia local · sem sincronização</span>
      </footer>
    </div>
    <dialog id="modal" aria-labelledby="modal-title">
      <div class="modal-head">
        <div>
          <span class="eyebrow" id="modal-eyebrow">PROJECT LAB</span>
          <h2 id="modal-title"></h2>
        </div>
        <button class="icon-button" id="close-modal" aria-label="Fechar janela">
          <span data-icon="x"></span>
        </button>
      </div>
      <div id="modal-content"></div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
